name: Demo media

# Re-records the README GIF and per-view screenshots with vhs.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "locales/**", "docs/tapes/**"]

permissions:
  contents: write

concurrency:
  group: demo-media
  cancel-in-progress: true

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - uses: charmbracelet/vhs-action@v2
        with:
          path: docs/tapes/demo-en.tape
      - uses: charmbracelet/vhs-action@v2
        with:
          path: docs/tapes/demo-tr.tape
      - uses: actions/upload-artifact@v4
        with:
          name: demo-media
          path: docs/media/
      - name: Commit media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/media
          git diff --cached --quiet || git commit -m "Update demo media [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
