name: Release

on:
  # Publishing a release in the GitHub UI (with a new v* tag) builds and attaches binaries.
  release:
    types: [published]
  # Manual run: builds every target; with `tag` set it attaches the files to that release.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach binaries to (empty = dry run)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag || 'dev' }}

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}
      # Package docs come from the workflow's branch so fixes reach existing releases.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: latest
          sparse-checkout: |
            packaging
            docs/INSTALL.md
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          name="argus-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp target/${{ matrix.target }}/release/argus LICENSE "dist/$name/"
          cp latest/packaging/README.md "dist/$name/README.md"
          cp latest/docs/INSTALL.md "dist/$name/INSTALL.md"
          tar czf "dist/$name.tar.gz" -C dist "$name"
          rm -rf "dist/$name"
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "argus-$env:TAG-${{ matrix.target }}"
          New-Item -ItemType Directory "dist/$name" -Force | Out-Null
          Copy-Item target/${{ matrix.target }}/release/argus.exe, LICENSE "dist/$name"
          Copy-Item latest/packaging/README.md "dist/$name/README.md"
          Copy-Item latest/docs/INSTALL.md "dist/$name/INSTALL.md"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          Remove-Item -Recurse "dist/$name"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  publish:
    needs: build
    if: github.event_name == 'release' || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          ls -la
          sha256sum argus-*.tar.gz argus-*.zip > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            dist/argus-*.tar.gz
            dist/argus-*.zip
            dist/SHA256SUMS

  # Keeps the Scoop manifest and Homebrew formula in this repository current.
  packages:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Render manifests
        run: |
          (cd dist && sha256sum argus-*.tar.gz argus-*.zip > SHA256SUMS)
          python3 packaging/render.py "$TAG" dist/SHA256SUMS
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/argus.json Formula/argus.rb
          git diff --cached --quiet || git commit -m "Update Scoop and Homebrew packages for $TAG"
          git pull --rebase origin main
          git push origin HEAD:main
      # Bot pushes start no workflows: verify the new manifests explicitly.
      - name: Verify package installs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run packages.yml --repo "${{ github.repository }}"
