name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all-targets
      - name: Build release
        run: cargo build --release

  e2e:
    name: end-to-end (collector + SSH)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Local collector reads fixture transcripts
        run: |
          ./target/release/argus --claude-dir tests/fixtures/claude snapshot --wait 0 > snap.json
          jq -e '.agents | length == 2' snap.json
          jq -e '[.agents[] | select(.name == "db-dev")] | length == 1' snap.json
          jq -e '[.messages[] | select(.kind == "Task")] | length == 1' snap.json
      - name: collect streams JSON frames
        run: |
          timeout 4 ./target/release/argus --claude-dir tests/fixtures/claude collect > frames.jsonl || true
          head -1 frames.jsonl | jq -e '.v == 1 and (.snapshot.agents | length == 2)'
      - name: Set up SSH to localhost
        run: |
          sudo apt-get install -y openssh-server
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keygen -t ed25519 -N "" -f ~/.ssh/id_ed25519 -q
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys
          sudo systemctl start ssh
          ssh -o StrictHostKeyChecking=accept-new localhost true
          mkdir -p ~/.claude && cp -r tests/fixtures/claude/projects ~/.claude/
          # A synthetic todo file in the fixture sessions' working folder.
          sudo mkdir -p /home/me/shop/tasks
          printf '## Backlog\n- [ ] synthetic item\n' | sudo tee /home/me/shop/tasks/todo.md
      - name: tasks/todo.md is read locally unless turned off
        run: |
          # snapshot leaves todo items out unless asked with --todos.
          ./target/release/argus --claude-dir tests/fixtures/claude snapshot --wait 0 > default.json
          jq -e '(.todos // []) | length == 0' default.json
          ./target/release/argus --claude-dir tests/fixtures/claude snapshot --todos --wait 0 > local.json
          jq -e '.todos[0].items[0].title == "synthetic item"' local.json
          ./target/release/argus --claude-dir tests/fixtures/claude --no-todos snapshot --todos --wait 0 > off.json
          jq -e '(.todos // []) | length == 0' off.json
      - name: Remote host over SSH (auto-installs argus)
        run: |
          ./target/release/argus --host localhost --no-local snapshot --wait 20 > remote.json
          jq '.hosts' remote.json
          jq -e '.hosts[0].connected == true' remote.json
          jq -e '.agents | length == 2' remote.json
          test -x ~/.cache/argus/argus
          # Remote todo items cross the network only on request.
          jq -e '(.todos // []) | length == 0' remote.json
          ./target/release/argus --host localhost --no-local --remote-todos snapshot --todos --wait 20 > remote-todos.json
          jq -e '.todos[0].items[0].title == "synthetic item"' remote-todos.json
      - name: Remote host on another platform (server downloads its own build)
        run: |
          rm -rf ~/.cache/argus
          ARGUS_FORCE_REMOTE_DOWNLOAD=1 ./target/release/argus --host localhost --no-local snapshot --wait 40 > remote2.json
          jq '.hosts' remote2.json
          jq -e '.hosts[0].connected == true' remote2.json
          jq -e '.agents | length == 2' remote2.json
          ~/.cache/argus/argus --version
      - name: Approval hook round trip
        run: |
          mkdir -p /tmp/cc && cp -r tests/fixtures/claude/projects /tmp/cc/
          echo '{"session_id":"sess-1","cwd":"/home/me/shop","hook_event_name":"PermissionRequest","tool_name":"Bash","tool_input":{"command":"rm -rf build"}}' \
            | ./target/release/argus --claude-dir /tmp/cc hook --wait 20 > hook.out &
          sleep 2
          ./target/release/argus --claude-dir /tmp/cc snapshot --wait 0 > s.json
          jq -e '[.messages[] | select(.kind == "Perm" and .request != null)] | length == 1' s.json
          jq -e '[.agents[] | select(.id == "sess-1" and .state == "Waiting")] | length == 1' s.json
          ID=$(jq -r '[.messages[] | select(.kind == "Perm")][0].request' s.json)
          mkdir -p /tmp/cc/argus/decisions
          echo '{"allow":true}' > "/tmp/cc/argus/decisions/$ID.json"
          wait
          cat hook.out
          jq -e '.hookSpecificOutput.hookEventName == "PermissionRequest" and .hookSpecificOutput.decision.behavior == "allow"' hook.out
          ./target/release/argus --claude-dir /tmp/cc hook --install
          ./target/release/argus --claude-dir /tmp/cc hook --install
          jq -e '.hooks.PermissionRequest | length == 2' /tmp/cc/settings.json
          jq -e '.hooks.Stop | length == 1' /tmp/cc/settings.json
      - name: Lifecycle event hook
        run: |
          echo '{"session_id":"sess-1","hook_event_name":"Notification","notification_type":"idle_prompt"}' \
            | ./target/release/argus --claude-dir /tmp/cc hook --event
          cat /tmp/cc/argus/events/events-*.jsonl
          jq -e 'select(.event == "Notification") | .sid == "sess-1" and .status == "idle_prompt"' /tmp/cc/argus/events/events-*.jsonl
